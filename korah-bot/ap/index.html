<!doctype html>
<html lang="en" x-data="{
  theme: localStorage.getItem('korah_theme') || 'dark',
  sidebarCollapsed: window.innerWidth <= 768 ? false : localStorage.getItem('korah_sidebar_collapsed') === 'true',
  mobileOpen: false,
  getEffectiveTheme() {
    if (this.theme === 'system') {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    return this.theme;
  },
  toggleSidebar() {
    if (window.innerWidth <= 768) {
      this.mobileOpen = !this.mobileOpen;
      const overlay = document.querySelector('.sidebar-overlay');
      if (overlay) overlay.classList.toggle('show', this.mobileOpen);
    } else {
      this.sidebarCollapsed = !this.sidebarCollapsed;
      localStorage.setItem('korah_sidebar_collapsed', this.sidebarCollapsed);
    }
  }
}" :data-theme="getEffectiveTheme()" x-cloak>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Korah AP Mock Exams</title>
  <link rel="icon" href="../logo-images/newlogo0.png">
  <script>
    (function() {
      const t = localStorage.getItem('korah_theme') || 'dark';
      const isL = t === 'light' || (t === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.setAttribute('data-theme', isL ? 'light' : 'dark');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="../sidebar-loader.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../study/js/sidebar.js"></script>
  <link rel="stylesheet" href="../app/korah-chat.css">
  <link rel="stylesheet" href="../sat/sat.css">
  <link rel="stylesheet" href="./ap.css">
  <script src="./js/ap-shared.js" defer></script>
  <script src="./js/ap-picker.js" defer></script>
</head>
<body class="ap-body">
  <canvas id="bg-canvas" class="ap-background" aria-hidden="true"></canvas>
  <div id="sidebar-root"></div>
  <main class="ap-main">
    <header class="ap-hero">
      <div class="ap-hero-copy">
        <p class="ap-eyebrow">Korah AP Prep</p>
        <h1>Walk into exam day <span>ready.</span></h1>
        <p>Full-length practice with authentic section timing, calculator rules, and a focused testing experience.</p>
        <div class="ap-hero-pills" aria-label="Exam features">
          <span><i class="material-icons-round">timer</i>Real timing</span>
          <span><i class="material-icons-round">lock</i>Secure sections</span>
          <span><i class="material-icons-round">insights</i>Score insights</span>
        </div>
      </div>
      <div class="ap-hero-mark" aria-hidden="true"><i class="material-icons-round">functions</i></div>
    </header>
    <section aria-labelledby="available-title">
      <div class="ap-section-heading">
        <div><p class="ap-eyebrow">Available now</p><h2 id="available-title">Choose an exam</h2></div>
      </div>
      <div id="exam-list" class="ap-exam-grid" aria-live="polite"><p class="ap-muted">Loading exams…</p></div>
    </section>
  </main>
  <script>
    window.KorahSidebar?.initBackground();
  </script>
</body>
</html>
