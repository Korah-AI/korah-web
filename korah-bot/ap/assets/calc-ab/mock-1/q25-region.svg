<svg xmlns="http://www.w3.org/2000/svg" width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="title desc">
  <title id="title">Region between y equals x and y equals x squared</title><desc id="desc">In the unit square, the line y equals x lies above the parabola y equals x squared; the region between them is shaded.</desc>
  <rect width="420" height="340" rx="12" fill="#fff"/><path d="M70 280h290M70 280V35" stroke="#374151" stroke-width="2"/>
  <path d="M70 280L330 50 C260 169 165 245 70 280Z" fill="#ddd6fe"/><path d="M70 280L330 50" stroke="#7c3aed" stroke-width="4"/><path d="M70 280C165 273 260 169 330 50" fill="none" stroke="#2563eb" stroke-width="4"/>
  <g font-family="Arial, sans-serif" font-size="20" fill="#111827"><text x="235" y="105">y = x</text><text x="235" y="220">y = x²</text><text x="326" y="305">1</text><text x="45" y="58">1</text></g>
</svg>
