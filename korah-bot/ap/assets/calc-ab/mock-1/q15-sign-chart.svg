<svg xmlns="http://www.w3.org/2000/svg" width="600" height="150" viewBox="0 0 600 150" role="img" aria-labelledby="title desc">
  <title id="title">Sign chart for f prime</title><desc id="desc">The derivative is positive before negative two, negative between negative two and one, and positive after one.</desc>
  <rect width="600" height="150" rx="12" fill="#fff"/><path d="M55 82h490" stroke="#374151" stroke-width="3"/><path d="M205 65v34M395 65v34" stroke="#374151" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="24" fill="#111827" text-anchor="middle"><text x="205" y="125">−2</text><text x="395" y="125">1</text><text x="125" y="52">+</text><text x="300" y="52">−</text><text x="475" y="52">+</text></g>
</svg>
