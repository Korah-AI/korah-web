<svg xmlns="http://www.w3.org/2000/svg" width="600" height="130" viewBox="0 0 600 130" role="img" aria-labelledby="title desc">
  <title id="title">Two-subinterval partition</title><desc id="desc">The interval zero to four is divided at two into two equal subintervals.</desc>
  <rect width="600" height="130" rx="12" fill="#fff"/><path d="M70 65h460M70 48v34M300 48v34M530 48v34" stroke="#374151" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="23" fill="#111827" text-anchor="middle"><text x="70" y="110">0</text><text x="300" y="110">2</text><text x="530" y="110">4</text><text x="185" y="36">Δx = 2</text><text x="415" y="36">Δx = 2</text></g>
</svg>
