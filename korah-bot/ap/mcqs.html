<!DOCTYPE html>
<html lang="en" x-data="{
  theme: localStorage.getItem('korah_theme') || 'dark',
  activeTab: 'ap',
  sidebarCollapsed: window.innerWidth <= 768 ? false : localStorage.getItem('korah_sidebar_collapsed') === 'true',
  mobileOpen: false,
  getEffectiveTheme() {
    if (this.theme === 'system') {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    return this.theme;
  },
  toggleSidebar() {
    if (window.innerWidth <= 768) {
      this.mobileOpen = !this.mobileOpen;
      const overlay = document.querySelector('.sidebar-overlay');
      if (overlay) overlay.classList.toggle('show', this.mobileOpen);
    } else {
      this.sidebarCollapsed = !this.sidebarCollapsed;
      localStorage.setItem('korah_sidebar_collapsed', this.sidebarCollapsed);
    }
  }
}" :data-theme="getEffectiveTheme()" x-cloak>
<head>
<link rel="stylesheet" href="../transitions/page-transitions.css"/>
<script src="../transitions/page-transitions.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Korah AI — AP MCQ Practice</title>
<link rel="icon" type="image/png" href="../logo-images/newlogo0.png">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="../sidebar-loader.js" defer></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../study/js/sidebar.js"></script>
<link rel="stylesheet" href="../app/korah-chat.css"/>
<link rel="stylesheet" href="../sat/sat.css"/>
<link rel="stylesheet" href="./ap.css"/>
<link rel="stylesheet" href="./mcq.css"/><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css"/>
</head>

<body class="sat-grey">
<style>
  html:not(.korah-page-ready) { background: #06040f !important; }
  html[data-theme="light"]:not(.korah-page-ready) { background: #d2d2d2 !important; }
  html:not(.korah-page-ready) body { opacity: 0 !important; }
</style>

<script>
  (function() {
    const t = localStorage.getItem('korah_theme') || 'dark';
    if (t === 'light' || (t === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
  import { setupKorahDB } from "../app/data/firestore-store.js";
  import { initAPProgress } from "./js/ap-progress.js";
  import { startAuthGuard } from '../auth-guard.js';
  import { initGuestGate, startGuestSession } from '../guest-gate.js';

  const firebaseConfig = {
    apiKey: "AIzaSyDvabVNkVMfjKl1m3dQSlW06h-iomgcNJM",
    authDomain: "korah-app.firebaseapp.com",
    projectId: "korah-app",
    storageBucket: "korah-app.firebasestorage.app",
    messagingSenderId: "226169460321",
    appId: "1:226169460321:web:b166fc8260107c55dafc20"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      // The course picker renders from static config; guests can browse it.
      startGuestSession();
      initGuestGate('../');
      return;
    }
    await setupKorahDB(app, user.uid);
    await initAPProgress(app, user.uid);
    const detail = { uid: user.uid };
    window._korahReadyFired = detail;
    window.dispatchEvent(new CustomEvent('korahReady', { detail }));
    startAuthGuard(auth, '../index.html');
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#logout-btn')) return;
    window.confirmLogout(async () => {
      await signOut(auth);
      localStorage.removeItem('korah_first_name');
      window.KorahTransitions.go('../login.html');
    });
  });
</script>

<canvas id="bg-canvas" class="fixed inset-0 z-0 pointer-events-none"></canvas>

        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <div class="chat-title-area">
      <div class="korah-status-dot"></div>
      <span class="font-semibold tx text-sm" id="chat-title">AP MCQ Practice</span>
    </div>
  </header>

  <div class="ap-page mcq-page" style="padding:1.25rem"><div class="ap-page-inner">
    <header class="sat-bank-topline"><img src="../logo-images/newlogo2.png" class="sat-bank-topline-logo" alt="Korah logo"/><h1 class="sat-bank-title">MCQ Practice</h1><a href="./index.html" class="sat-bank-backlink">FRQ Practice →</a></header>
    <div id="mcq-root"><p role="status">Loading courses…</p></div>
    <noscript>Please enable JavaScript to use MCQ practice.</noscript>
  </div></div>
</main></div>
<script src="../app/timer-manager.js"></script>

<script>window.addEventListener('korahReady', () => { window.KorahSidebar?.initSidebar({ chatBaseUrl:'../chat.html', itemPageUrl:'../study/item.html' }); }, { once:true });</script>
</body></html>
