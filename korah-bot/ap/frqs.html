<!DOCTYPE html>
<html lang="en" x-data="{
  theme: localStorage.getItem('korah_theme') || 'dark',
  sidebarCollapsed: window.innerWidth <= 768 ? false : localStorage.getItem('korah_sidebar_collapsed') === 'true',
  mobileOpen: false,
  getEffectiveTheme() {
    if (this.theme === 'system') {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    return this.theme;
  },
  toggleSidebar() {
    if (window.innerWidth <= 768) {
      this.mobileOpen = !this.mobileOpen;
      const overlay = document.querySelector('.sidebar-overlay');
      if (overlay) overlay.classList.toggle('show', this.mobileOpen);
    } else {
      this.sidebarCollapsed = !this.sidebarCollapsed;
      localStorage.setItem('korah_sidebar_collapsed', this.sidebarCollapsed);
    }
  }
}" :data-theme="getEffectiveTheme()" x-cloak>

<script>
  (function() {
    const t = localStorage.getItem('korah_theme') || 'dark';
    if (t === 'light' || (t === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
  import { setupKorahDB } from "../app/data/firestore-store.js";
  import { initAPProgress } from "./js/ap-progress.js";
  import { startAuthGuard } from '../auth-guard.js';
  import { initGuestGate, startGuestSession, showGuestToastOnce } from '../guest-gate.js';

  const firebaseConfig = {
    apiKey: "AIzaSyDvabVNkVMfjKl1m3dQSlW06h-iomgcNJM",
    authDomain: "korah-app.firebaseapp.com",
    projectId: "korah-app",
    storageBucket: "korah-app.firebasestorage.app",
    messagingSenderId: "226169460321",
    appId: "1:226169460321:web:b166fc8260107c55dafc20"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      // The picker is served from static JSON; guests can browse it.
      startGuestSession();
      initGuestGate('../');
      showGuestToastOnce();
      return;
    }
    await setupKorahDB(app, user.uid);
    await initAPProgress(app, user.uid);
    const detail = { uid: user.uid };
    window._korahReadyFired = detail;
    window.dispatchEvent(new CustomEvent('korahReady', { detail }));
    startAuthGuard(auth, '../index.html');
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#logout-btn')) return;
    window.confirmLogout(async () => {
      await signOut(auth);
      localStorage.removeItem('korah_first_name');
      window.KorahTransitions.go('../login.html');
    });
  });
</script>

<script>
  // Initialize sidebar with chat-specific callbacks
  window.addEventListener('korahReady', () => {
    if (window.KorahSidebar) {
      window.KorahSidebar.initSidebar({
        chatBaseUrl: "../chat.html",
        itemPageUrl: "../study/item.html"
      });
    }
  }, { once: true });
</script>

<script src="./js/ap-bank.js"></script>

<script>
  (function () {
    if (!window.KorahAP) return;

    const params = new URLSearchParams(location.search);
    const courseSlug = params.get('course') || '';
    const course = window.KorahAP.getCourse(courseSlug);
    const list = document.getElementById('frq-list');

    if (!course) {
      document.getElementById('frq-course-title').textContent = 'Unknown course';
      list.innerHTML = '<p class="ap-panel-empty">That course does not exist yet. <a href="./index.html">Back to courses</a>.</p>';
      return;
    }

    document.title = 'Korah AI — ' + course.name + ' · AP FRQ';
    document.getElementById('frq-course-title').textContent = course.name;
    document.getElementById('frq-course-desc').textContent = course.description;
    document.getElementById('frq-list-title').textContent = course.shortName + ' ' + course.frqLabel.toLowerCase();

    function countPoints(frq) {
      return (frq.parts || []).reduce((n, p) => n + (p.rubricPoints || []).length, 0);
    }

    let attemptsById = new Map(); // frqId -> { count, lastScore, totalPoints }

    function badgeFor(frq) {
      const a = attemptsById.get(frq.id);
      if (!a) return '';
      const last = a.totalPoints ? ` · ${a.lastScore}/${a.totalPoints} last` : '';
      return `<span class="ap-badge ap-badge-attempted"><span class="material-icons-round" style="font-size:0.8125rem;">check_circle</span>Attempted${last}</span>`;
    }

    function renderRows(frqs) {
      list.innerHTML = frqs.map((frq, i) => `
        <a class="ap-frq-row" href="./attempt.html?course=${encodeURIComponent(courseSlug)}&frq=${encodeURIComponent(frq.id)}">
          <div class="ap-frq-idx">${frq.questionNumber != null ? frq.questionNumber : i + 1}</div>
          <div class="ap-frq-body">
            <div class="ap-frq-name">${frq.year} FRQ ${frq.questionNumber != null ? frq.questionNumber : ''} · ${frq.title}</div>
            <div class="ap-frq-topic">${frq.topic || 'Mixed topics'} · ${countPoints(frq)} rubric points</div>
          </div>
          <div class="ap-frq-meta">
            <span class="ap-badge ap-badge-timer"><span class="material-icons-round" style="font-size:0.8125rem;">schedule</span>${frq.timeAllottedMin} min</span>
            ${frq.calculatorAllowed
              ? '<span class="ap-badge"><span class="material-icons-round" style="font-size:0.8125rem;">calculate</span>Calculator allowed</span>'
              : '<span class="ap-badge"><span class="material-icons-round" style="font-size:0.8125rem;">block</span>No calculator</span>'}
            ${badgeFor(frq)}
          </div>
        </a>`).join('');
      document.getElementById('frq-list-count').textContent = frqs.length + ' available';
    }

    function applyAttempts(map) {
      attemptsById = map || new Map();
      // Rerender rows if they already exist so badges appear.
      window.KorahAP.loadFrqs(courseSlug).then(renderRows);
    }

    window.KorahAP.loadFrqs(courseSlug).then(renderRows).catch(() => {});

    window.addEventListener('korahReady', async () => {
      if (!window.KorahAPProgress || !window.KorahAPProgress.latestPerFrq) return;
      try {
        const placeholders = await window.KorahAPProgress.loadPlaceholderAttempts(courseSlug);
        applyAttempts(window.KorahAPProgress.latestPerFrq(placeholders));
      } catch (e) {}
      if (window.KorahAPProgress.getFrqAttemptCounts) {
        try {
          applyAttempts(await window.KorahAPProgress.getFrqAttemptCounts(courseSlug));
        } catch (e) {}
      }
    }, { once: true });
  })();
</script>
