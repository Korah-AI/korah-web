<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<link rel="stylesheet" href="transitions/page-transitions.css"/>
<script src="transitions/page-transitions.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Korah A.I — Login</title>
<link rel="icon" type="image/png" href="logo-images/newlogo0.png">

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  /* 🪨 FOUC PREVENTION */
  html:not(.korah-page-ready) { background: #000 !important; }
  html:not(.korah-page-ready) body { opacity: 0 !important; }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: #000;
    color: #fff;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow-x: hidden;
  }

  /* 🪨 DOT-MATRIX BACKGROUND */
  .kl-dots {
    position: fixed; inset: 0; z-index: 0;
    width: 100%; height: 100%;
  }
  .kl-vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(circle at center, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 100%);
  }

  /* 🪨 STAGE */
  .kl-stage {
    position: relative; z-index: 2;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1.75rem;
    padding: 2rem 1.25rem;
  }

  /* 🪨 CARD */
  .kl-card {
    width: 100%; max-width: 25rem;
    background: #121212;
    border: 0.0625rem solid #222;
    border-radius: 0.75rem;
    box-shadow: 0 0.625rem 2.5rem rgba(0,0,0,0.8);
    padding: 2rem;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }
  .kl-logo {
    width: 2.75rem; height: 2.75rem;
    object-fit: contain;
    margin-bottom: 0.75rem;
  }
  .kl-title {
    font-size: 1.35rem; font-weight: 600;
    letter-spacing: -0.025em;
    margin: 0 0 0.25rem;
  }
  .kl-sub {
    font-size: 0.85rem; color: #888; line-height: 1.5;
    margin: 0 0 1.25rem;
  }

  /* 🪨 BUTTONS */
  .kl-btn {
    width: 100%;
    padding: 0.65rem;
    border-radius: 0.375rem;
    border: 0.0625rem solid #333;
    background: transparent;
    color: #fff;
    font-family: inherit;
    font-weight: 500; font-size: 0.875rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
  }
  .kl-btn:hover:not(:disabled) {
    background: rgba(255,255,255,0.06);
    border-color: #4a4a4a;
    transform: scale(1.02);
  }
  .kl-btn:active:not(:disabled) { transform: scale(0.99); }
  .kl-btn:disabled { cursor: default; color: #aaa; }

  .kl-spinner {
    width: 1rem; height: 1rem;
    border: 0.125rem solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: kl-spin 0.7s linear infinite;
  }
  @keyframes kl-spin { to { transform: rotate(360deg); } }

  .kl-btn-primary {
    background: #ededed; border-color: #ededed; color: #000;
  }
  .kl-btn-primary:hover:not(:disabled) { background: #fff; border-color: #fff; }
  .kl-btn-primary:disabled { color: #555; }
  .kl-btn-primary .kl-spinner { border-color: rgba(0,0,0,0.25); border-top-color: #000; }

  /* 🪨 FORMS */
  .kl-form {
    width: 100%;
    display: flex; flex-direction: column; gap: 0.65rem;
    margin-bottom: 0.85rem;
  }
  .kl-form[hidden] { display: none; }
  .kl-row { display: flex; gap: 0.65rem; }
  .kl-row > .kl-field { flex: 1; min-width: 0; }
  .kl-field { text-align: left; }
  .kl-input {
    width: 100%;
    padding: 0.65rem 0.85rem;
    border-radius: 0.375rem;
    border: 0.0625rem solid #333;
    background: #000; color: #fff;
    font-family: inherit; font-size: 0.875rem;
    outline: none;
    transition: border-color 0.18s ease;
  }
  .kl-input::placeholder { color: #5a5a5a; }
  .kl-input:focus { border-color: #5a5a5a; }
  .kl-input.invalid { border-color: #b91c1c; }
  .kl-pw { position: relative; }
  .kl-pw .kl-input { padding-right: 2.5rem; }
  .kl-pw-toggle {
    position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; padding: 0.25rem; line-height: 0;
    color: #888; cursor: pointer; opacity: 0.6;
    transition: opacity 0.18s ease;
  }
  .kl-pw-toggle:hover { opacity: 1; }
  .kl-field-err {
    display: block; margin-top: 0.3rem;
    font-size: 0.75rem; color: #f87171;
  }

  /* 🪨 DIVIDER */
  .kl-divider {
    width: 100%;
    display: flex; align-items: center; gap: 0.75rem;
    margin-bottom: 0.85rem;
    font-size: 0.75rem; color: #666;
  }
  .kl-divider::before, .kl-divider::after {
    content: ''; flex: 1; height: 0.0625rem; background: #222;
  }

  /* 🪨 MODE SWITCH */
  .kl-switch { margin: 0.75rem 0 0; font-size: 0.875rem; color: #888; }
  .kl-switch button {
    background: none; border: none; padding: 0;
    color: #fff; font-family: inherit; font-size: inherit; font-weight: 500;
    cursor: pointer;
  }
  .kl-switch button:hover { text-decoration: underline; }

  .kl-error {
    min-height: 1.125rem;
    margin: 0.5rem 0 0;
    font-size: 0.8rem; color: #f87171;
  }
  .kl-terms {
    margin: 0.85rem 0 0;
    font-size: 0.75rem; color: #666; line-height: 1.5;
  }
  .kl-terms a { color: #888; text-decoration: none; }
  .kl-terms a:hover { color: #bbb; }

  /* 🪨 UNIVERSITY MARQUEE */
  .kl-marquee-wrap { width: 100%; max-width: 35rem; }
  .kl-marquee-label {
    margin: 0 0 0.5rem;
    text-align: center;
    font-size: 0.8125rem; font-weight: 500;
    color: #fff;
  }
  .kl-marquee {
    overflow: hidden;
    padding: 0.25rem 0;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
            mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
  }
  .kl-marquee-track {
    display: flex; width: max-content;
    gap: 2.625rem;
    animation: kl-marquee-scroll 60s linear infinite;
    /* Own compositor layer: at ~0.4px per frame the track otherwise snaps to
       whole pixels on the main thread and the scroll reads as jittery. */
    will-change: transform;
    backface-visibility: hidden;
  }
  /* -50% lands half a gap short of one full set, so pull back the extra gap/2 */
  @keyframes kl-marquee-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(-50% - 1.3125rem)); }
  }
  .kl-marquee:hover .kl-marquee-track { animation-play-state: paused; }

  .kl-uni {
    display: flex; align-items: center; gap: 0.5rem;
    white-space: nowrap;
    user-select: none;
  }
  .kl-uni-chip {
    width: 1.75rem; height: 1.75rem;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 0.1875rem;
    border-radius: 0.375rem;
    background: rgba(255,255,255,0.95);
  }
  .kl-uni-chip img {
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
  }
  .kl-uni-name { font-size: 0.8125rem; font-weight: 500; color: #9a9a9a; }

  @media (max-width: 30rem) {
    .kl-card { padding: 1.5rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .kl-marquee-track { animation: none; }
  }
</style>
</head>
<body>

<canvas id="dotCanvas" class="kl-dots" aria-hidden="true"></canvas>
<div class="kl-vignette" aria-hidden="true"></div>

              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>

              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>

      <div class="kl-field">

      <div class="kl-field">
        <div class="kl-pw">

          <button type="button" class="kl-pw-toggle" data-target="regPassword" aria-label="Show password">
            <svg class="kl-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="kl-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" hidden>
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>

      <button type="submit" class="kl-btn kl-btn-primary" id="registerSubmit">

        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>

<script>
  /* 🪨 UNIVERSITY MARQUEE — one set rendered twice for a seamless loop */
  (function () {
    const UNIVERSITIES = [
      { name: 'Harvard',   file: 'harvard',   alt: 'Harvard University' },
      { name: 'Yale',      file: 'yale',      alt: 'Yale University' },
      { name: 'Princeton', file: 'princeton', alt: 'Princeton University' },
      { name: 'Stanford',  file: 'stanford',  alt: 'Stanford University' },
      { name: 'MIT',       file: 'mit',       alt: 'Massachusetts Institute of Technology' },
      { name: 'Columbia',  file: 'columbia',  alt: 'Columbia University' },
      { name: 'Penn',      file: 'upenn',     alt: 'University of Pennsylvania' },
      { name: 'Caltech',   file: 'caltech',   alt: 'California Institute of Technology' },
      { name: 'Cornell',   file: 'cornell',   alt: 'Cornell University' },
      { name: 'Brown',     file: 'brown',     alt: 'Brown University' },
      { name: 'UChicago',  file: 'uchicago',  alt: 'University of Chicago' },
      { name: 'Duke',      file: 'duke',      alt: 'Duke University' }
    ];

    const track = document.getElementById('marqueeTrack');
    if (!track) return;

    const html = UNIVERSITIES.map(u => `
      <div class="kl-uni">
        <span class="kl-uni-chip"><img src="logo-images/universities/${u.file}.png" alt="${u.alt}" width="28" height="28"/></span>
        <span class="kl-uni-name">${u.name}</span>
      </div>`).join('');

    track.innerHTML = html + html;
  })();

  /* 🪨 DOT-MATRIX BACKGROUND (vanilla port of the 21st.dev WebGL dot grid)
     Waits for DOMContentLoaded so the deferred three.js tag has run. */
  window.addEventListener('DOMContentLoaded', function () {
    const canvas = document.getElementById('dotCanvas');
    if (!canvas || !window.THREE) return;

    const THREE = window.THREE;
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
    } catch (e) {
      return; // no WebGL: the page falls back to the plain black background
    }
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene  = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const uniforms = {
      u_time: { value: 0 },
      u_resolution: { value: new THREE.Vector2(window.innerWidth * 2, window.innerHeight * 2) },
      u_opacities: { value: [0.3, 0.3, 0.3, 0.5, 0.5, 0.5, 0.8, 0.8, 0.8, 1.0] },
      /* mostly white, with two Korah purples mixed in */
      u_colors: { value: [
        new THREE.Vector3(1, 1, 1),
        new THREE.Vector3(1, 1, 1),
        new THREE.Vector3(0.65, 0.55, 0.98),
        new THREE.Vector3(1, 1, 1),
        new THREE.Vector3(0.54, 0.36, 0.96),
        new THREE.Vector3(1, 1, 1)
      ] },
      u_total_size: { value: 20.0 },
      u_dot_size: { value: 6.0 }
    };

    const material = new THREE.ShaderMaterial({
      vertexShader: `
        precision mediump float;
        uniform vec2 u_resolution;
        out vec2 fragCoord;
        void main() {
          gl_Position = vec4(position, 1.0);
          fragCoord = (position.xy + 1.0) * 0.5 * u_resolution;
          fragCoord.y = u_resolution.y - fragCoord.y;
        }
      `,
      fragmentShader: `
        precision mediump float;
        in vec2 fragCoord;

        uniform float u_time;
        uniform float u_opacities[10];
        uniform vec3 u_colors[6];
        uniform float u_total_size;
        uniform float u_dot_size;
        uniform vec2 u_resolution;

        out vec4 fragColor;

        float PHI = 1.61803398874989484820459;
        float random(vec2 xy) {
            return fract(tan(distance(xy * PHI, xy) * 0.5) * xy.x);
        }

        void main() {
            vec2 st = fragCoord.xy;
            st.x -= abs(floor((mod(u_resolution.x, u_total_size) - u_dot_size) * 0.5));
            st.y -= abs(floor((mod(u_resolution.y, u_total_size) - u_dot_size) * 0.5));

            float opacity = step(0.0, st.x) * step(0.0, st.y);

            vec2 st2 = vec2(int(st.x / u_total_size), int(st.y / u_total_size));

            float frequency = 5.0;
            float show_offset = random(st2);
            float rand = random(st2 * floor((u_time / frequency) + show_offset + frequency));
            opacity *= u_opacities[int(rand * 10.0)];
            opacity *= 1.0 - step(u_dot_size / u_total_size, fract(st.x / u_total_size));
            opacity *= 1.0 - step(u_dot_size / u_total_size, fract(st.y / u_total_size));

            vec3 color = u_colors[int(show_offset * 6.0)];

            float animation_speed_factor = 3.0;
            vec2 center_grid = u_resolution / 2.0 / u_total_size;
            float dist_from_center = distance(center_grid, st2);

            float current_timing_offset = dist_from_center * 0.01 + (random(st2) * 0.15);

            opacity *= step(current_timing_offset, u_time * animation_speed_factor);
            opacity *= clamp((1.0 - step(current_timing_offset + 0.1, u_time * animation_speed_factor)) * 1.25, 1.0, 1.25);

            fragColor = vec4(color, opacity);
            fragColor.rgb *= fragColor.a;
        }
      `,
      uniforms: uniforms,
      glslVersion: THREE.GLSL3,
      blending: THREE.CustomBlending,
      blendSrc: THREE.SrcAlphaFactor,
      blendDst: THREE.OneFactor,
      transparent: true
    });

    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

    const startTime = performance.now();
    (function draw() {
      requestAnimationFrame(draw);
      uniforms.u_time.value = (performance.now() - startTime) / 1000.0;
      renderer.render(scene, camera);
    })();

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      uniforms.u_resolution.value.set(window.innerWidth * 2, window.innerHeight * 2);
    });
  });
</script>

<script type="module">
  /* 🪨 FIREBASE & GOOGLE AUTH */
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    signInWithPopup, GoogleAuthProvider, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDvabVNkVMfjKl1m3dQSlW06h-iomgcNJM",
    authDomain: "korah-app.firebaseapp.com",
    projectId: "korah-app",
    storageBucket: "korah-app.firebasestorage.app",
    messagingSenderId: "226169460321",
    appId: "1:226169460321:web:b166fc8260107c55dafc20"
  };

  const app   = initializeApp(firebaseConfig);
  const auth  = getAuth(app);
  const gProv = new GoogleAuthProvider();

  onAuthStateChanged(auth, u => { if (u) window.KorahTransitions.go('home.html'); });

  const $ = id => document.getElementById(id);

  const loginForm    = $('loginForm');
  const registerForm = $('registerForm');
  const googleBtn    = $('googleBtn');
  const googleIcon   = $('googleIcon');
  const formError    = $('formError');
  const buttons      = [$('loginSubmit'), $('registerSubmit'), googleBtn];
  let mode = 'login';

  const LABELS = {
    loginSubmit:    ['Sign In', 'Signing in...'],
    registerSubmit: ['Create Account', 'Creating...'],
    googleBtn:      ['Continue with Google', 'Signing in...']
  };

  function setBusy(btn, on) {
    buttons.forEach(b => { b.disabled = on; });
    btn.querySelector('.kl-spinner').hidden = !on;
    btn.querySelector('.kl-btn-label').textContent = LABELS[btn.id][on ? 1 : 0];
    if (btn === googleBtn) googleIcon.style.display = on ? 'none' : '';
  }

  /* 🪨 FIELD ERRORS */
  const FIELDS = ['loginEmail', 'loginPassword', 'regFirst', 'regLast', 'regEmail', 'regPassword'];

  function clearErrors() {
    formError.textContent = '';
    FIELDS.forEach(f => {
      $(f + 'Err').textContent = '';
      $(f).classList.remove('invalid');
    });
  }
  function setError(field, msg) {
    $(field + 'Err').textContent = msg;
    $(field).classList.add('invalid');
  }
  function hasError(...fields) {
    return fields.some(f => $(f + 'Err').textContent);
  }
  FIELDS.forEach(f => $(f).addEventListener('input', clearErrors));

  /* 🪨 SIGN IN / CREATE ACCOUNT SWITCH */
  $('switchBtn').addEventListener('click', () => {
    mode = mode === 'login' ? 'register' : 'login';
    const isLogin = mode === 'login';
    clearErrors();
    loginForm.hidden    = !isLogin;
    registerForm.hidden = isLogin;
    $('cardTitle').textContent  = isLogin ? 'Sign in to Korah A.I' : 'Create your Korah account';
    $('cardSub').textContent    = isLogin ? 'Continue your journey to a better score.'
                                          : 'Start your journey to a better score.';
    $('switchText').textContent = isLogin ? "Don't have an account?" : 'Already have an account?';
    $('switchBtn').textContent  = isLogin ? 'Sign Up' : 'Sign In';
  });

  /* 🪨 PASSWORD VISIBILITY */
  document.querySelectorAll('.kl-pw-toggle').forEach(toggle => {
    toggle.addEventListener('click', () => {
      const input = $(toggle.dataset.target);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      toggle.querySelector('.kl-eye').hidden = show;
      toggle.querySelector('.kl-eye-off').hidden = !show;
    });
  });

  /* 🪨 EMAIL SIGN IN */
  loginForm.addEventListener('submit', async e => {
    e.preventDefault();
    clearErrors();

    const email    = $('loginEmail').value.trim();
    const password = $('loginPassword').value.trim();

    if (!email && !password) {
      formError.textContent = 'Please fill in all fields.';
      $('loginEmail').classList.add('invalid');
      $('loginPassword').classList.add('invalid');
      return;
    }
    if (!email) setError('loginEmail', 'Email is required.');
    else if (!email.includes('@')) setError('loginEmail', 'Enter a valid email.');
    if (!password) setError('loginPassword', 'Password is required.');
    if (hasError('loginEmail', 'loginPassword')) return;

    setBusy($('loginSubmit'), true);
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      setBusy($('loginSubmit'), false);
      if (err.code === 'auth/invalid-email')  return setError('loginEmail', 'Invalid email.');
      if (err.code === 'auth/user-not-found') return setError('loginEmail', 'Email not found.');
      if (err.code === 'auth/user-disabled')  return setError('loginEmail', 'Account disabled.');
      if (err.code === 'auth/wrong-password') return setError('loginPassword', 'Invalid password.');
      setError('loginEmail', 'Invalid email or password.');
      setError('loginPassword', 'Invalid email or password.');
      return;
    }
    setBusy($('loginSubmit'), false);
  });

  /* 🪨 EMAIL SIGN UP */
  registerForm.addEventListener('submit', async e => {
    e.preventDefault();
    clearErrors();

    const first    = $('regFirst').value.trim();
    const last     = $('regLast').value.trim();
    const email    = $('regEmail').value.trim();
    const password = $('regPassword').value.trim();

    if (!first && !last && !email && !password) {
      formError.textContent = 'Please fill in all fields.';
      ['regFirst', 'regLast', 'regEmail', 'regPassword'].forEach(f => $(f).classList.add('invalid'));
      return;
    }
    if (!first) setError('regFirst', 'First name is required.');
    if (!last)  setError('regLast', 'Last name is required.');
    if (!email) setError('regEmail', 'Email is required.');
    else if (!email.includes('@')) setError('regEmail', 'Enter a valid email.');
    if (!password) setError('regPassword', 'Password is required.');
    else if (password.length < 6) setError('regPassword', 'Password must be 6+ characters.');
    if (hasError('regFirst', 'regLast', 'regEmail', 'regPassword')) return;

    setBusy($('registerSubmit'), true);
    try {
      await createUserWithEmailAndPassword(auth, email, password);
      localStorage.setItem('korah_first_name', first);
    } catch (err) {
      setBusy($('registerSubmit'), false);
      if (err.code === 'auth/email-already-in-use') return setError('regEmail', 'Email already in use.');
      if (err.code === 'auth/invalid-email')        return setError('regEmail', 'Invalid email.');
      if (err.code === 'auth/weak-password')        return setError('regPassword', 'Password too weak.');
      setError('regEmail', 'Registration failed.');
      return;
    }
    setBusy($('registerSubmit'), false);
  });

  /* 🪨 GOOGLE */
  googleBtn.addEventListener('click', async () => {
    clearErrors();
    setBusy(googleBtn, true);

    /* Wrap window.open so a user-closed popup rejects instead of hanging. */
    let popupRef = null;
    const origOpen = window.open;
    window.open = (url, name, features) => {
      popupRef = origOpen.call(window, url, name, features);
      window.open = origOpen;
      return popupRef;
    };

    try {
      await Promise.race([
        signInWithPopup(auth, gProv),
        new Promise((_, reject) => {
          const timer = setInterval(() => {
            if (popupRef && popupRef.closed) {
              clearInterval(timer);
              reject(new Error('popup-closed'));
            }
          }, 100);
        })
      ]);
    } catch (e) {
      setBusy(googleBtn, false);
      if (e.message !== 'popup-closed') {
        formError.textContent = mode === 'login'
          ? 'Failed Login: Try again in a few seconds.'
          : 'Failed Registration: Try again in a few seconds.';
      }
      return;
    }
    setBusy(googleBtn, false);
  });

  document.documentElement.classList.add('korah-page-ready');
</script>

</body>
</html>
