<div class="sidebar-overlay" @click="mobileOpen = false; document.querySelector('.sidebar-overlay').classList.remove('show')"></div>

<!-- ═══ SIDEBAR ═══ -->
<aside id="sidebar" class="sidebar bg-sf glass t-theme"
  :class="{ collapsed: sidebarCollapsed, 'mobile-open': mobileOpen }"
  x-effect="window.KorahSidebar?.onCollapseChange?.(sidebarCollapsed)"
  @resize.window="if (window.innerWidth > 768) { mobileOpen = false; const overlay = document.querySelector('.sidebar-overlay'); if (overlay) overlay.classList.remove('show'); }">
  <div class="sidebar-header">
    <a href="/home.html" class="flex items-center gap-2.5 no-underline">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center font-display text-xl">
        <span class="logo-letter">
          <img src="/logo-images/newlogo2.png" alt="Korah" style="width:2.5rem;height:2.5rem;object-fit:contain;"/>
        </span>
      </div>
      <div class="flex flex-col leading-tight">
        <span class="font-display text-[1.1875rem] font-bold tx">Korah AI</span>
      </div>
    </a>
  </div>

  <nav class="sidebar-nav">
    <span class="sidebar-section-label">HOME</span>
    <a href="/home.html" class="sidebar-nav-link t-btn"><span class="material-icons-round" style="font-size: 1.25rem;">home</span> <span class="nav-text">Home</span></a>
    <a href="/chat.html" class="sidebar-nav-link t-btn"><span class="material-icons-round" style="font-size: 1.25rem;">chat</span> <span class="nav-text">Ask Korah</span></a>
    <a href="/study/feed.html" class="sidebar-nav-link t-btn"><span class="material-icons-round" style="font-size: 1.25rem;">school</span> <span class="nav-text">Study</span></a>
    <span class="sidebar-section-label">SAT Practice</span>
    <a href="/sat/dashboard.html" class="sidebar-nav-link t-btn"><span class="material-icons-round" style="font-size: 1.25rem;">insights</span> <span class="nav-text">Dashboard</span></a>
    <a href="/sat/index.html" class="sidebar-nav-link t-btn"><span class="material-icons-round" style="font-size: 1.25rem;">assignment</span> <span class="nav-text">Question Bank</span></a>
    <a href="/sat/latest-questions.html" class="sidebar-nav-link t-btn"><span class="material-icons-round" style="font-size: 1.25rem;">fiber_new</span> <span class="nav-text">Latest Questions</span></a>
    <a href="/sat/vocab/learn.html" class="sidebar-nav-link t-btn"><span class="material-icons-round" style="font-size: 1.25rem;">menu_book</span> <span class="nav-text">Vocab</span></a>
    <div class="electric-border-wrapper" style="position:relative;overflow:visible;isolation:isolate;border-radius:0.625rem;">
      <canvas class="electric-border-canvas" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:2;display:block;"></canvas>
      <div style="position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;">
        <div style="position:absolute;inset:0;border-radius:inherit;border:0.09375rem solid rgba(59,130,246,0.45);filter:blur(1px);"></div>
        <div style="position:absolute;inset:0;border-radius:inherit;border:0.09375rem solid #3b82f6;filter:blur(0.25rem);"></div>
      </div>
      <a href="/sat/math-chat.html" class="sidebar-nav-link t-btn" style="position:relative;z-index:1;"><span class="material-icons-round" style="font-size: 1.25rem;">calculate</span> <span class="nav-text">Desmos Chat</span></a>
    </div>
    <a href="/sat/rush.html" class="sidebar-nav-link t-btn"><span class="material-icons-round" style="font-size: 1.25rem;">bolt</span> <span class="nav-text">Practice Rush</span></a>
    <a href="/sat/study-plan.html" class="sidebar-nav-link t-btn"><span class="material-icons-round" style="font-size: 1.25rem;">event</span> <span class="nav-text">Study Plan</span></a>
  </nav>

  <div class="flex items-center justify-between px-1 flex-shrink-0" style="margin: 0.75rem 0 0.25rem;">
    <span class="sidebar-section-label" style="margin:0">Recent Chats</span>
  </div>
  <div class="sidebar-middle">
    <div class="select-bar-wrapper">
      <div id="chat-select-bar" class="select-bar">
        <span class="select-bar-count" id="chat-select-count">0 selected</span>
        <div class="select-bar-actions">
          <button class="select-bar-btn" id="chat-select-all" title="Select all">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </button>
          <button class="select-bar-btn" id="chat-deselect-all" title="Deselect all">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
          <button class="select-bar-btn danger" id="chat-delete-selected" title="Delete selected"></button>
        </div>
      </div>
    </div>
    <div id="chat-history" class="chat-history">
      <div class="skeleton-item"><div class="skeleton-icon"></div><div class="skeleton-text"></div></div>

      <div class="skeleton-item"><div class="skeleton-icon"></div><div class="skeleton-text"></div></div>
    </div>
  </div>

  <div class="sidebar-footer">
    <div class="mood-indicator" id="sidebar-mood">

      <span class="text-xs tx2 font-medium">Full Focus Mode</span>
    </div>
    <div class="sidebar-footer-actions">
      <button id="logout-btn" class="theme-toggle-small t-btn" title="Log out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
      <button id="settings-btn" class="theme-toggle-small t-btn" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button @click="theme = theme === 'dark' ? 'light' : 'dark'; localStorage.setItem('korah_theme', theme)" class="theme-toggle-small t-btn" title="Toggle theme">
        <svg x-show="theme==='light'" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" style="color:var(--p5)">
          <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
        </svg>
        <svg x-show="theme==='dark'" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--p4)">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </div>
  </div>
</aside>
