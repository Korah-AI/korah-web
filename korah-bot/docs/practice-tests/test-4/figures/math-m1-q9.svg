<svg xmlns="http://www.w3.org/2000/svg" width="460" height="260" viewBox="0 0 460 260" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="460" height="260" fill="#ffffff"/>
  <text x="230" y="24" text-anchor="middle" font-size="14" font-weight="bold">Similar Right Triangles PQR and STU</text>
  <text x="20" y="250" font-size="12" fill="#666" font-style="italic">Note: Figures not drawn to scale.</text>

  <!-- triangle PQR -->
  <g stroke="#333" fill="#eaf1fb" stroke-width="2">
    <polygon points="40,210 200,210 40,60"/>
  </g>
  <g font-size="14" fill="#222">
    <text x="25" y="228">P</text>
    <text x="205" y="228">R</text>
    <text x="30" y="55">Q</text>
  </g>
  <rect x="120" y="210" width="8" height="8" fill="#fff" stroke="#333"/>
  <text x="132" y="220" font-size="13">18°</text>
  <text x="60" y="145" font-size="12" fill="#777">(right angle at R)</text>

  <!-- triangle STU -->
  <g stroke="#333" fill="#eaf9ee" stroke-width="2">
    <polygon points="240,210 400,210 240,60"/>
  </g>
  <g font-size="14" fill="#222">
    <text x="225" y="228">S</text>
    <text x="405" y="228">U</text>
    <text x="230" y="55">T</text>
  </g>
  <rect x="320" y="210" width="8" height="8" fill="#fff" stroke="#333"/>
  <text x="252" y="145" font-size="12" fill="#777">?  (same 18° as Q)</text>
</svg>
