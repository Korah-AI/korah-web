<svg xmlns="http://www.w3.org/2000/svg" width="340" height="300" viewBox="0 0 340 300" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="340" height="300" fill="#ffffff"/>
  <text x="170" y="24" text-anchor="middle" font-size="14" font-weight="bold">Scatterplot of x and y</text>

  <!-- axes -->
  <line x1="60" y1="20" x2="60" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="260" x2="320" y2="260" stroke="#333" stroke-width="2"/>
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="190" y="292">x</text>
    <text x="34" y="150" text-anchor="middle">y</text>
  </g>

  <!-- points rising with x (positive trend, y = 0.9 + 9.4x-ish) -->
  <g fill="#3a6fd8">
    <circle cx="90" cy="235" r="4"/>
    <circle cx="110" cy="215" r="4"/>
    <circle cx="130" cy="190" r="4"/>
    <circle cx="150" cy="165" r="4"/>
    <circle cx="175" cy="135" r="4"/>
    <circle cx="200" cy="110" r="4"/>
    <circle cx="225" cy="85" r="4"/>
    <circle cx="250" cy="60" r="4"/>
    <circle cx="275" cy="40" r="4"/>
  </g>
  <line x1="90" y1="240" x2="275" y2="40" stroke="#e05555" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="285" y="40" font-size="12" fill="#c0392b">trend line</text>
</svg>
