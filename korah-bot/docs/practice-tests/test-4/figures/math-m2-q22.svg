<svg xmlns="http://www.w3.org/2000/svg" width="340" height="300" viewBox="0 0 340 300" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="340" height="300" fill="#ffffff"/>
  <text x="170" y="24" text-anchor="middle" font-size="14" font-weight="bold">System of Linear Equations</text>

  <!-- axes -->
  <line x1="60" y1="150" x2="320" y2="150" stroke="#333" stroke-width="2"/>
  <line x1="180" y1="20" x2="180" y2="280" stroke="#333" stroke-width="2"/>
  <text x="312" y="145" font-size="12" fill="#444">x</text>
  <text x="168" y="28" font-size="12" fill="#444">y</text>

  <!-- two lines crossing at a point -->
  <line x1="60" y1="230" x2="310" y2="60" stroke="#3a6fd8" stroke-width="3"/>
  <line x1="80" y1="40" x2="300" y2="240" stroke="#c0392b" stroke-width="3"/>
  <circle cx="195" cy="120" r="5" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="205" y="112" font-size="13" fill="#222">(x, y)</text>
</svg>
