<svg xmlns="http://www.w3.org/2000/svg" width="460" height="300" viewBox="0 0 460 300" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="460" height="300" fill="#ffffff"/>
  <text x="230" y="26" text-anchor="middle" font-size="14" font-weight="bold">Estimated Chipmunks (April 1), 1989–1999</text>

  <line x1="70" y1="30" x2="70" y2="250" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="250" x2="450" y2="250" stroke="#333" stroke-width="2"/>
  <text x="260" y="286" text-anchor="middle" font-size="13" fill="#333">Year</text>

  <g stroke="#ccc">
    <line x1="70" y1="250" x2="450" y2="250"/>
    <line x1="70" y1="200" x2="450" y2="200"/>
    <line x1="70" y1="150" x2="450" y2="150"/>
    <line x1="70" y1="100" x2="450" y2="100"/>
    <line x1="70" y1="50" x2="450" y2="50"/>
  </g>
  <g font-size="12" fill="#444" text-anchor="end">
    <text x="64" y="254">0</text>
    <text x="64" y="204">25</text>
    <text x="64" y="154">50</text>
    <text x="64" y="104">75</text>
    <text x="64" y="54">100</text>
  </g>

  <!-- line trending down then up across years -->
  <polyline fill="none" stroke="#3a6fd8" stroke-width="3"
    points="90,60 125,95 160,210 195,225 230,180 265,150 300,160 335,120 370,90 405,75"/>
  <g fill="#3a6fd8">
    <circle cx="90" cy="60" r="4"/><circle cx="125" cy="95" r="4"/><circle cx="160" cy="210" r="4"/><circle cx="195" cy="225" r="4"/><circle cx="230" cy="180" r="4"/>
    <circle cx="265" cy="150" r="4"/><circle cx="300" cy="160" r="4"/><circle cx="335" cy="120" r="4"/><circle cx="370" cy="90" r="4"/><circle cx="405" cy="75" r="4"/>
  </g>
  <g font-size="11" fill="#666" text-anchor="middle">
    <text x="96" y="270">89</text><text x="126" y="270">90</text><text x="158" y="270">91</text><text x="192" y="270">92</text><text x="227" y="270">93</text>
    <text x="262" y="270">94</text><text x="297" y="270">95</text><text x="333" y="270">96</text><text x="367" y="270">97</text><text x="401" y="270">98</text><text x="430" y="270">99</text>
  </g>
</svg>
