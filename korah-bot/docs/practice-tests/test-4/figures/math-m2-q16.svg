<svg xmlns="http://www.w3.org/2000/svg" width="460" height="300" viewBox="0 0 460 300" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="460" height="300" fill="#ffffff"/>
  <text x="230" y="24" text-anchor="middle" font-size="14" font-weight="bold">Parallel Lines m and n with Transversal</text>

  <!-- parallel lines m (top) and n (bottom) -->
  <line x1="40" y1="80" x2="430" y2="80" stroke="#333" stroke-width="3"/>
  <line x1="40" y1="220" x2="430" y2="220" stroke="#333" stroke-width="3"/>
  <text x="436" y="85" font-size="15" font-weight="bold" fill="#333">m</text>
  <text x="436" y="225" font-size="15" font-weight="bold" fill="#333">n</text>

  <!-- transversal crossing -->
  <line x1="60" y1="260" x2="360" y2="45" stroke="#e05555" stroke-width="3"/>
  <text x="368" y="42" font-size="14" fill="#c0392b">t</text>

  <!-- angle labels: x = 6k+13 (upper right reflex?), y = 8k-29 -->
  <text x="268" y="62" font-size="15" fill="#1f3f8f">x = 6k + 13</text>
  <text x="300" y="240" font-size="15" fill="#1f3f8f">y = 8k − 29</text>
</svg>
