<svg xmlns="http://www.w3.org/2000/svg" width="340" height="300" viewBox="0 0 340 300" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="340" height="300" fill="#ffffff"/>
  <text x="170" y="24" text-anchor="middle" font-size="14" font-weight="bold">Graph of y = −x − 8</text>

  <!-- axes -->
  <line x1="60" y1="150" x2="320" y2="150" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="20" x2="70" y2="270" stroke="#333" stroke-width="2"/>
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="310" y="144">x</text>
    <text x="46" y="30">y</text>
  </g>
  <g font-size="12" fill="#666" text-anchor="middle">
    <text x="70" y="166">0</text>
    <text x="110" y="166">2</text>
    <text x="150" y="166">4</text>
    <text x="190" y="166">6</text>
    <text x="230" y="166">8</text>
  </g>

  <!-- line y = -x - 8: at x=-8 y=0 (x-axis int), at x=0 y=-8 -->
  <g stroke="#777">
    <line x1="110" y1="150" x2="110" y2="270"/><line x1="150" y1="150" x2="150" y2="270"/><line x1="190" y1="150" x2="190" y2="270"/><line x1="230" y1="150" x2="230" y2="270"/>
    <line x1="70" y1="190" x2="320" y2="190"/><line x1="70" y1="230" x2="320" y2="230"/><line x1="70" y1="270" x2="320" y2="270"/>
  </g>

  <line x1="70" y1="150" x2="310" y2="270" stroke="#3a6fd8" stroke-width="3"/>
  <circle cx="70" cy="150" r="4" fill="#3a6fd8"/>
  <text x="70" y="144" font-size="12" fill="#1f3f8f" text-anchor="middle">(−8, 0)</text>
</svg>
