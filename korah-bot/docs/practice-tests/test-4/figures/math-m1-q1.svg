<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="520" height="360" fill="#ffffff"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold">Students Who Voted for Each Activity</text>

  <!-- axes: y 0-45, x activities 1-5 -->
  <line x1="80" y1="40" x2="80" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="300" x2="480" y2="300" stroke="#333" stroke-width="2"/>

  <!-- y-axis ticks -->
  <g font-size="13" fill="#444" text-anchor="end">
    <text x="72" y="304">0</text>
    <text x="72" y="248">10</text>
    <text x="72" y="196">20</text>
    <text x="72" y="144">30</text>
    <text x="72" y="92">40</text>
  </g>
  <g stroke="#ccc">
    <line x1="80" y1="300" x2="480" y2="300"/>
    <line x1="80" y1="250" x2="480" y2="250"/>
    <line x1="80" y1="200" x2="480" y2="200"/>
    <line x1="80" y1="150" x2="480" y2="150"/>
    <line x1="80" y1="100" x2="480" y2="100"/>
  </g>

  <!-- bars: scale 5 px per unit; 39 votes => height ~195 -->
  <g>
    <rect x="110" y="180" width="60" height="120" fill="#7da5ed"/>
    <rect x="200" y="150" width="60" height="150" fill="#7da5ed"/>
    <rect x="290" y="105" width="60" height="195" fill="#3a6fd8"/>
    <rect x="380" y="210" width="60" height="90" fill="#7da5ed"/>
  </g>

  <!-- x-axis labels -->
  <g font-size="14" fill="#222" text-anchor="middle">
    <text x="140" y="322">1</text>
    <text x="230" y="322">2</text>
    <text x="320" y="322">3</text>
    <text x="410" y="322">4</text>
  </g>
  <text x="280" y="348" text-anchor="middle" font-size="14" fill="#333">Activity</text>

  <!-- highlight activity 3 -->
  <text x="320" y="90" text-anchor="middle" font-size="14" fill="#1f3f8f" font-weight="bold">39</text>
</svg>
