<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="340" height="200" fill="#ffffff"/>
  <text x="170" y="24" text-anchor="middle" font-size="14" font-weight="bold">Dot Plot: 15 Values in Data Set A</text>

  <!-- axis -->
  <line x1="50" y1="130" x2="320" y2="130" stroke="#333" stroke-width="2"/>
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="60" y="150">30</text><text x="110" y="150">40</text><text x="160" y="150">50</text>
    <text x="210" y="150">60</text><text x="260" y="150">70</text><text x="310" y="150">80</text>
  </g>

  <!-- dots: 15 total clustered around center -->
  <g fill="#3a6fd8">
    <circle cx="85" cy="110" r="7"/><circle cx="95" cy="110" r="7"/>
    <circle cx="135" cy="100" r="7"/><circle cx="145" cy="100" r="7"/><circle cx="155" cy="100" r="7"/>
    <circle cx="185" cy="88" r="7"/><circle cx="195" cy="88" r="7"/><circle cx="205" cy="88" r="7"/><circle cx="215" cy="88" r="7"/>
    <circle cx="245" cy="100" r="7"/><circle cx="255" cy="100" r="7"/><circle cx="265" cy="100" r="7"/>
    <circle cx="295" cy="110" r="7"/><circle cx="305" cy="110" r="7"/><circle cx="315" cy="110" r="7"/>
  </g>
</svg>
