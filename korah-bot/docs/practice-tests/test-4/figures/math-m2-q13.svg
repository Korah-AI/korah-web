<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="480" height="240" fill="#ffffff"/>
  <text x="240" y="26" text-anchor="middle" font-size="14" font-weight="bold">Distribution of 100 Tiles by Color and Shape</text>

  <g font-size="14" fill="#222" text-anchor="middle">
    <text x="150" y="60">Square</text>
    <text x="280" y="60">Circle</text>
    <text x="410" y="60">Triangle</text>
    <text x="70" y="125">Red</text>
    <text x="70" y="190">Blue</text>
  </g>

  <g stroke="#333" fill="#fff" font-size="15" text-anchor="middle">
    <rect x="110" y="80" width="80" height="40"/><rect x="240" y="80" width="80" height="40"/><rect x="370" y="80" width="80" height="40"/>
    <rect x="110" y="145" width="80" height="40"/><rect x="240" y="145" width="80" height="40"/><rect x="370" y="145" width="80" height="40"/>
    <text x="150" y="106">21</text><text x="280" y="106">28</text><text x="410" y="106">17</text>
    <text x="150" y="171">12</text><text x="280" y="171">15</text><text x="410" y="171">7</text>
  </g>

  <g font-size="11" fill="#666" text-anchor="middle">
