<!DOCTYPE html>
<html lang="en" x-data="{
  theme: localStorage.getItem('korah_theme') || 'dark',
  sidebarCollapsed: window.innerWidth <= 768 ? false : localStorage.getItem('korah_sidebar_collapsed') === 'true',
  mobileOpen: false,
  getEffectiveTheme() {
    if (this.theme === 'system') {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    return this.theme;
  },
  toggleSidebar() {
    if (window.innerWidth <= 768) {
      this.mobileOpen = !this.mobileOpen;
      const overlay = document.querySelector('.sidebar-overlay');
      if (overlay) overlay.classList.toggle('show', this.mobileOpen);
    } else {
      this.sidebarCollapsed = !this.sidebarCollapsed;
      localStorage.setItem('korah_sidebar_collapsed', this.sidebarCollapsed);
    }
  }
}" :data-theme="getEffectiveTheme()" x-cloak>
<head>
  <link rel="stylesheet" href="../transitions/page-transitions.css"/>
  <script src="../transitions/page-transitions.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Korah AI — SAT Study Plan</title>
  <link rel="icon" type="image/png" href="../logo-images/newlogo0.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="../sidebar-loader.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../app/korah-chat.css"/>
  <link rel="stylesheet" href="./sat.css"/>
</head>

<body>
<script>
  (function() {
    const t = localStorage.getItem('korah_theme') || 'dark';
    if (t === 'light' || (t === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
  import { setupKorahDB } from "../app/data/firestore-store.js";
  import { initStudyPlan } from "./js/study-plan.js";
  import { startAuthGuard } from '../auth-guard.js';

  const firebaseConfig = {
    apiKey: "AIzaSyDvabVNkVMfjKl1m3dQSlW06h-iomgcNJM",
    authDomain: "korah-app.firebaseapp.com",
    projectId: "korah-app",
    storageBucket: "korah-app.firebasestorage.app",
    messagingSenderId: "226169460321",
    appId: "1:226169460321:web:b166fc8260107c55dafc20"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, async (user) => {
    // Signed-out users are not redirected for now, so the page stays reachable
    // on Live Server where sign-in is unavailable.
    if (!user) { console.warn('[StudyPlan] no signed-in user'); return; }
    await setupKorahDB(app, user.uid);
    await initStudyPlan(app, user.uid);
    const detail = { uid: user.uid };
    window._korahReadyFired = detail;
    window.dispatchEvent(new CustomEvent('korahReady', { detail }));
    startAuthGuard(auth, '../landing/index.html');
  });

  document.getElementById('logout-btn').addEventListener('click', () => {
    window.confirmLogout(async () => {
      await signOut(auth);
      localStorage.removeItem('korah_first_name');
      window.KorahTransitions.go('../login.html');
    });
  });
</script>

<canvas id="bg-canvas" class="fixed inset-0 z-0 pointer-events-none"></canvas>
<div id="sidebar-root"></div>

<!-- ═══ MAIN AREA WRAPPER ═══ -->
<div id="main-area-wrapper" class="main-area-wrapper">
<main id="main-content" class="main-content">

  <header class="chat-topbar bg-sf glass-sm t-theme bd" style="opacity: 0.95;">
    <button id="sidebar-toggle" @click="toggleSidebar()" class="sidebar-toggle-btn t-btn tx2" aria-label="Toggle sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="chat-title-area">
      <div class="korah-status-dot"></div>
      <span class="font-semibold tx text-sm">Study Plan</span>
    </div>
  </header>

  <div class="sat-page" style="padding: 1.5rem; max-width: 72rem; margin: 0 auto; overflow-y: auto; flex: 1; min-height: 0;">

    <!-- STATE: LOADING -->
    <template x-if="$store.studyPlan.planState === 'loading'">
      <div class="panel-card" style="text-align:center; padding:4rem;">
        <div class="sat-spinner" style="width:2.5rem;height:2.5rem;margin:0 auto 1rem;border:3px solid var(--bd);border-top-color:var(--p4);border-radius:50%;animation:spin 1s linear infinite;"></div>
        <p class="tx2">Loading your study plan…</p>
        <template x-if="$store.studyPlan.initError">
          <p class="tx3" style="margin-top:1rem;color:#ef4444;">Error: {{ $store.studyPlan.initError }}</p>
          <button class="sat-button sat-button-secondary" style="margin-top:1rem;" @click="location.reload()">Retry</button>
        </template>
        <template x-if="!$store.studyPlan.initError && $store.studyPlan.initStages.length > 0">
          <p class="tx3" style="margin-top:1rem;color:var(--p5);">
            Initializing: {{ $store.studyPlan.initStages.join(', ') }}
          </p>
        </template>
      </div>
    </template>

    <!-- STATE: EMPTY (WIZARD) -->
    <template x-if="$store.studyPlan.planState === 'empty'">
      <div x-data="wizard()" class="wizard-container" style="max-width:64rem;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:2rem;padding:0 1rem;">
        <!-- Progress header - SEPARATE CARD -->
        <div class="panel-card" style="padding:2rem 2.25rem;border-radius:1.5rem;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.25rem;">
            <div style="display:flex;align-items:center;gap:1rem;">
              <div style="width:3rem;height:3rem;border-radius:0.875rem;background:linear-gradient(135deg,#7c3aed,#a78bfa);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <span class="material-icons-round" style="font-size:1.5rem;color:#fff;">auto_awesome</span>
              </div>
              <div>
                <div style="font-size:0.75rem;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--p5);">Step</div>
                <div style="font-size:1.25rem;font-weight:800;color:var(--tx);">Step <span x-text="step"></span> of 4</div>
              </div>
            </div>
            <div style="font-size:1rem;font-weight:800;color:var(--p5);background:rgba(124,58,237,0.15);padding:0.5rem 1rem;border-radius:999px;" x-text="progressPercentage + '%'"></div>
          </div>
          <div style="height:0.625rem;background:var(--sf2);border-radius:999px;overflow:hidden;">
            <div style="height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa,#c084fc);border-radius:999px;transition:width .35s ease;" :style="`width: ${progressPercentage}%`"></div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:1.5rem;gap:0.75rem;">
            <template x-for="i in 4" :key="i">
              <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:0.75rem;min-width:0;">
                <div class="wizard-step-circle" :class="step >= i ? 'active' : ''" x-text="i"></div>
                <span style="font-size:0.8125rem;font-weight:700;white-space:nowrap;text-align:center;line-height:1.2;" :style="step >= i ? 'color: var(--tx);' : 'color: var(--tx3);'" x-text="i===1 ? 'Start' : i===2 ? 'Level' : i===3 ? 'Test Date' : 'Schedule'"></span>
              </div>
            </template>
          </div>
        </div>

        <!-- Step 1: Start Point - SEPARATE CARD -->
        <template x-if="step === 1">
          <div class="panel-card" style="padding:2.25rem;border-radius:1.5rem;display:flex;flex-direction:column;align-items:center;" x-transition>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;">
              <h3 style="font-size:1.625rem;font-weight:800;color:var(--tx);margin:0 0 0.5rem;">Where are you starting from?</h3>
              <p class="tx2" style="font-size:1.0625rem;margin:0 auto 0;line-height:1.5;max-width:36rem;">Choose the option that best describes your current preparation level.</p>
            </div>
            <div class="radio-group" style="text-align:left;width:100%;margin-top:1.75rem;">
              <label class="radio-card" @click="intake.startPoint='real_sat'" style="padding:1.75rem;border-radius:1rem;cursor:pointer;">
                <input type="radio" name="startPoint" value="real_sat" x-model="intake.startPoint" class="hidden"/>
                <div class="radio-card-content" style="gap:1.125rem;">
                  <span class="material-icons-round" style="font-size:2rem;color:var(--p5);">assignment_turned_in</span>
                  <div style="display:flex;flex-direction:column;gap:0.375rem;flex:1;">
                    <strong class="tx" style="font-size:1.125rem;">Took the real SAT</strong>
                    <span class="tx2" style="font-size:0.9375rem;">You have an official score report</span>
                  </div>
                </div>
                <span class="radio-check" :class="{ active: intake.startPoint==='real_sat' }"></span>
              </label>
              <label class="radio-card" @click="intake.startPoint='practice_test'" style="padding:1.75rem;border-radius:1rem;cursor:pointer;">
                <input type="radio" name="startPoint" value="practice_test" x-model="intake.startPoint" class="hidden"/>
                <div class="radio-card-content" style="gap:1.125rem;">
                  <span class="material-icons-round" style="font-size:2rem;color:var(--p5);">assignment</span>
                  <div style="display:flex;flex-direction:column;gap:0.375rem;flex:1;">
                    <strong class="tx" style="font-size:1.125rem;">Took a practice test</strong>
                    <span class="tx2" style="font-size:0.9375rem;">Bluebook, Khan Academy, or other full practice test</span>
                  </div>
                </div>
                <span class="radio-check" :class="{ active: intake.startPoint==='practice_test' }"></span>
              </label>
              <label class="radio-card" @click="intake.startPoint='none'" style="padding:1.75rem;border-radius:1rem;cursor:pointer;">
                <input type="radio" name="startPoint" value="none" x-model="intake.startPoint" class="hidden"/>
                <div class="radio-card-content" style="gap:1.125rem;">
                  <span class="material-icons-round" style="font-size:2rem;color:var(--p5);">help_outline</span>
                  <div style="display:flex;flex-direction:column;gap:0.375rem;flex:1;">
                    <strong class="tx" style="font-size:1.125rem;">Haven't tested yet</strong>
                    <span class="tx2" style="font-size:0.9375rem;">Rate your confidence on each SAT domain instead</span>
                  </div>
                </div>
                <span class="radio-check" :class="{ active: intake.startPoint==='none' }"></span>
              </label>
            </div>
          </div>
        </template>

        <!-- Step 2: Level -->
        <template x-if="step === 2">
          <div style="display:flex;flex-direction:column;gap:1.5rem;">
            <!-- If tested: image upload -->
            <template x-if="intake.startPoint !== 'none'">
              <div class="panel-card" style="padding:2rem;border-radius:1.5rem;" x-transition>
                <h3 style="font-size:1.5rem;font-weight:800;color:var(--tx);margin:0 0 0.5rem;">Upload your score report</h3>
                <p class="tx2" style="font-size:1rem;margin-bottom:1.5rem;line-height:1.5;">We will read your Math and Reading and Writing scores automatically. Upload a screenshot of your official score report.</p>
                <div class="drop-zone" @click="$refs.fileInput.click()" @dragover.prevent @drop.prevent="handleDrop" :class="{ 'has-file': scoreImages.length }" style="min-height:16rem;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;width:100%;">
                  <div x-show="!scoreImages.length" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center;">
                    <div style="width:4.5rem;height:4.5rem;border-radius:1.125rem;background:rgba(124,58,237,0.12);display:flex;align-items:center;justify-content:center;margin:0 auto;">
                      <span class="material-icons-round" style="font-size:2.25rem;color:var(--p5);">cloud_upload</span>
                    </div>
                    <p class="tx" style="font-size:1.125rem;font-weight:700;margin:0;">Click or drag a screenshot here</p>
                    <p class="tx3" style="font-size:0.875rem;margin:0;">PNG, JPG, or WebP · Max 4.5 MB each · You can add more than one</p>
                  </div>
                  <div x-show="scoreImages.length" style="width:100%;">
                    <template x-for="(img, i) in scoreImages" :key="i">
                      <div style="position:relative;margin-bottom:1rem;">
                        <button @click.stop="removeImage(i)" style="position:absolute;top:0.5rem;right:0.5rem;z-index:2;width:1.75rem;height:1.75rem;border-radius:50%;background:rgba(0,0,0,0.6);border:1px solid var(--bd);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;line-height:1;text-align:center;padding:0;" title="Remove image">X</button>
                        <img :src="img" alt="Score report preview" style="max-width:100%;max-height:24rem;border-radius:1rem;border:1px solid var(--bd);object-fit:contain;margin:0 auto;display:block;"/>
                      </div>
                    </template>
                    <p class="tx2" style="margin-top:0.5rem;font-weight:600;font-size:0.9375rem;">Click or drag to add another screenshot</p>
                  </div>
                  <input type="file" x-ref="fileInput" accept="image/*" multiple class="hidden" @change="handleFileSelect"/>
                </div>
                <div x-show="extracting" style="margin-top:1.5rem;text-align:center;padding:1.5rem;background:var(--sf2);border-radius:1rem;border:1px solid var(--bd);">
                  <div style="width:2.5rem;height:2.5rem;margin:0 auto 1rem;border:3px solid var(--bd);border-top-color:var(--p4);border-radius:50%;animation:spin 1s linear infinite;"></div>
                  <p class="tx" style="font-weight:700;font-size:1rem;">Reading scores from image…</p>
                </div>
                <div x-show="extractedScores" style="margin-top:1.5rem;padding:1.5rem;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.25);border-radius:1rem;">
                  <p style="margin:0;color:#22c55e;font-weight:800;font-size:1rem;"><span class="material-icons-round" style="font-size:1.25rem;vertical-align:middle;margin-right:0.5rem;">check_circle</span>Scores extracted</p>
                  <div style="display:flex;gap:1.25rem;margin-top:1rem;flex-wrap:wrap;">
                    <div style="flex:1;min-width:10rem;padding:1.125rem;background:var(--sf);border-radius:0.875rem;border:1px solid var(--bd);text-align:center;">
                      <div style="font-size:0.8125rem;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:0.05em;">Math</div>
                      <div style="font-size:1.75rem;font-weight:800;color:var(--p5);margin-top:0.25rem;" x-text="extractedScores?.mathScore ?? '—'"></div>
                    </div>
                    <div style="flex:1;min-width:10rem;padding:1.125rem;background:var(--sf);border-radius:0.875rem;border:1px solid var(--bd);text-align:center;">
                      <div style="font-size:0.8125rem;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:0.05em;">Reading and Writing</div>
                      <div style="font-size:1.75rem;font-weight:800;color:var(--p5);margin-top:0.25rem;" x-text="extractedScores?.rwScore ?? '—'"></div>
                    </div>
                  </div>
                  <button class="sat-button sat-button-secondary" style="margin-top:1.25rem;width:100%;height:3rem;font-size:1rem;" @click="clearScores()">Start over</button>
                </div>

                <!-- Manual entry, so a failed or unavailable extraction is not a dead end -->
                <div style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--bd);">
                  <p class="tx2" style="font-size:0.9375rem;margin:0 0 1rem;">Or enter your scores yourself.</p>
                  <div style="display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-end;">
                    <label style="flex:1;min-width:9rem;display:flex;flex-direction:column;gap:0.5rem;">
                      <span class="tx3" style="font-size:0.8125rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;">Math</span>
                      <input type="text" inputmode="numeric" maxlength="3" x-model="manualMath" placeholder="680" class="sat-date-select" style="text-align:center;"/>
                    </label>
                    <label style="flex:1;min-width:9rem;display:flex;flex-direction:column;gap:0.5rem;">
                      <span class="tx3" style="font-size:0.8125rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;">Reading and Writing</span>
                      <input type="text" inputmode="numeric" maxlength="3" x-model="manualRw" placeholder="720" class="sat-date-select" style="text-align:center;"/>
                    </label>
                    <button class="sat-button sat-button-secondary" style="height:3.5rem;min-width:9rem;font-size:1rem;" @click="applyManualScores()">Use these scores</button>
                  </div>
                </div>
              </div>
            </template>

            <!-- If not tested: confidence ratings -->
            <template x-if="intake.startPoint === 'none'">
              <div class="panel-card" style="padding:2rem;border-radius:1.5rem;" x-transition>
                <h3 style="font-size:1.5rem;font-weight:800;color:var(--tx);margin:0 0 0.5rem;">Rate your confidence</h3>
                <p class="tx2" style="font-size:1rem;margin-bottom:1.5rem;line-height:1.5;">1 = Need lots of work, 2 = Okay, 3 = Strong. Be honest so the plan can target your weak spots.</p>
                <div style="display:grid;gap:1.25rem;">
                  <div style="padding:1.25rem;background:var(--sf2);border-radius:1rem;border:1px solid var(--bd);">
                    <div style="font-size:0.8125rem;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--p5);margin-bottom:1rem;">Math domains</div>
                    <div style="display:grid;gap:1rem;">
                      <template x-for="d in mathDomains" :key="d.key">
                        <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0.625rem 0;border-bottom:1px solid var(--bd);">
                          <span class="tx" style="font-size:1rem;font-weight:600;flex:1;min-width:0;" x-text="d.label"></span>
                          <div style="display:flex;gap:0.625rem;flex-shrink:0;">
                            <template x-for="v in [1,2,3]" :key="v">
                              <button type="button" class="rating-btn" style="width:3rem;height:3rem;font-size:1.125rem;" :class="{ active: intake.confidenceRatings[d.key]===v }" @click="intake.confidenceRatings[d.key]=v" x-text="v"></button>
                            </template>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                  <div style="padding:1.25rem;background:var(--sf2);border-radius:1rem;border:1px solid var(--bd);">
                    <div style="font-size:0.8125rem;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--p5);margin-bottom:1rem;">Reading and Writing domains</div>
                    <div style="display:grid;gap:1rem;">
                      <template x-for="d in rwDomains" :key="d.key">
                        <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0.625rem 0;border-bottom:1px solid var(--bd);">
                          <span class="tx" style="font-size:1rem;font-weight:600;flex:1;min-width:0;" x-text="d.label"></span>
                          <div style="display:flex;gap:0.625rem;flex-shrink:0;">
                            <template x-for="v in [1,2,3]" :key="v">
                              <button type="button" class="rating-btn" style="width:3rem;height:3rem;font-size:1.125rem;" :class="{ active: intake.confidenceRatings[d.key]===v }" @click="intake.confidenceRatings[d.key]=v" x-text="v"></button>
                            </template>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>
                <div style="margin-top:1.75rem;">
                  <label class="tx" style="display:block;font-size:1rem;font-weight:700;margin-bottom:0.75rem;">What do you want from this plan? <span style="font-weight:400;color:var(--tx3);font-size:0.9375rem;">(optional)</span></label>
                  <textarea x-model="intake.freeTextGoals" rows="4" style="width:100%;min-height:7rem;padding:1rem 1.125rem;border-radius:0.875rem;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font-family:inherit;font-size:1rem;resize:vertical;line-height:1.5;" placeholder="e.g. Focus on algebra word problems, improve reading speed, practice full tests under timed conditions…"></textarea>
                </div>
              </div>
            </template>
          </div>
        </template>

        <!-- Step 3: Test Date -->
        <template x-if="step === 3">
          <div class="panel-card" style="padding:2rem;border-radius:1.5rem;" x-transition>
            <h3 style="font-size:1.5rem;font-weight:800;color:var(--tx);margin:0 0 0.5rem;">When is your test?</h3>
            <p class="tx2" style="font-size:1rem;margin-bottom:1.5rem;line-height:1.5;">Pick your official test date. We will build your plan up to that day.</p>
            <div style="margin-bottom:1.75rem;">
              <label style="display:block;font-size:0.875rem;font-weight:700;color:var(--tx2);margin-bottom:0.625rem;">Test date</label>
              <div style="display:flex;gap:0.75rem;align-items:center;">
                <select class="sat-date-select" @change="intake.testDate = dateYear + '-' + dateMonth + '-' + dateDay" x-model="dateMonth">
                  <option value="">Month</option>
                  <option value="01">Jan</option><option value="02">Feb</option><option value="03">Mar</option>
                  <option value="04">Apr</option><option value="05">May</option><option value="06">Jun</option>
                  <option value="07">Jul</option><option value="08">Aug</option><option value="09">Sep</option>
                  <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
                </select>
                <select class="sat-date-select" @change="intake.testDate = dateYear + '-' + dateMonth + '-' + dateDay" x-model="dateDay" style="flex:1;">
                  <option value="">Day</option>
                  <template x-for="d in 31" :key="d"><option :value="String(d).padStart(2,'0')" x-text="d"></option></template>
                </select>
                <select class="sat-date-select" @change="intake.testDate = dateYear + '-' + dateMonth + '-' + dateDay" x-model="dateYear" style="flex:1;">
                  <option value="">Year</option>
                  <option value="2026">2026</option><option value="2027">2027</option><option value="2028">2028</option>
                </select>
              </div>
            </div>

<!-- Alpine components -->
<script>
  // Wizard component
  function wizard() {
    return {
      step: 1,
      get progressPercentage() { return Math.round((this.step / 4) * 100); },
      intake: {
        startPoint: "none",
        mathScore: null,
        rwScore: null,
        confidenceRatings: {},
        freeTextGoals: "",
        testDate: "",
        studyDays: [],
        hoursPerWeek: 6
      },
      scoreImages: [],
      extractedScores: null,
      manualMath: "",
      manualRw: "",
      extracting: false,
      generating: false,
      dateMonth: "",
      dateDay: "",
      dateYear: "",
      selectOfficialDate(d) {
        const [y, m, day] = d.split('-');
        this.dateYear = y;
        this.dateMonth = m;
        this.dateDay = day;
        this.intake.testDate = d;
      },
      
      mathDomains: [
        { key: "heartOfAlgebra", label: "Algebra" },
        { key: "passportAdvancedMath", label: "Advanced Math" },
        { key: "problemSolvingData", label: "Problem-Solving and Data Analysis" },
        { key: "additionalTopicsMath", label: "Geometry and Trigonometry" }
      ],
      rwDomains: [
        { key: "informationIdeas", label: "Information & Ideas" },
        { key: "craftStructure", label: "Craft & Structure" },
        { key: "expressionIdeas", label: "Expression of Ideas" },
        { key: "standardEnglish", label: "Standard English Conventions" }
      ],
      weekdays: [
        { key: "mon", label: "Mon" }, { key: "tue", label: "Tue" }, { key: "wed", label: "Wed" },
        { key: "thu", label: "Thu" }, { key: "fri", label: "Fri" }, { key: "sat", label: "Sat" }, { key: "sun", label: "Sun" }
      ],
      officialDates: [
        "2026-09-12", "2026-10-03", "2026-11-07", "2026-12-05",
        "2027-03-06", "2027-05-01", "2027-06-05"
      ],
      get todayISO() { return new Date().toISOString().split('T')[0]; },

      canProceed() {
        if (this.step === 1) return !!this.intake.startPoint;
        if (this.step === 2) {
          if (this.intake.startPoint !== 'none') return this.intake.mathScore != null && this.intake.rwScore != null;
          const allKeys = [...this.mathDomains, ...this.rwDomains].map(d => d.key);
          return allKeys.every(k => this.intake.confidenceRatings[k] >= 1 && this.intake.confidenceRatings[k] <= 3);
        }
        if (this.step === 3) return !!this.intake.testDate && new Date(this.intake.testDate) > new Date();
        if (this.step === 4) return this.intake.studyDays.length >= 2 && this.intake.hoursPerWeek >= 2;
        return false;
      },
      nextStep() { if (this.canProceed()) this.step++; },
      prevStep() { if (this.step > 1) this.step--; },
      toggleDay(key) {
        const i = this.intake.studyDays.indexOf(key);
        if (i >= 0) this.intake.studyDays.splice(i, 1);
        else this.intake.studyDays.push(key);
      },
      formatDate(iso) { return new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); },
      // Optional chaining on window.KorahStudyPlan silently no-ops when the
      // module never initialised (no signed-in user), so ask for it explicitly.
      planApi() {
        if (!window.KorahStudyPlan) {
          throw new Error("You need to be signed in to build a study plan. Sign in and try again.");
        }
        return window.KorahStudyPlan;
      },
      handleFileSelect(e) { this.processFiles(e.target.files); },
      handleDrop(e) { this.processFiles(e.dataTransfer.files); },
      async processFiles(fileList) {
        const files = Array.from(fileList || []).filter(f => f.type.startsWith('image/'));
        if (files.length === 0) return;
        this.extracting = true;
        try {
          const api = this.planApi();
          for (const file of files) {
            const dataUrl = await api.downscaleImage(file);
            if (!dataUrl) continue;
            this.scoreImages.push(dataUrl);
            const scores = await api.extractScoresFromImage(dataUrl);
            this.mergeScores(scores);
          }
        } catch (e) { console.error(e); alert(e.message || "Failed to read scores. Try a clearer image."); }
        finally { this.extracting = false; }
      },
      // Score reports are often split across screenshots, so keep whichever
      // score each image contributes rather than replacing the whole result.
      mergeScores(scores) {
        if (!scores) return;
        const next = { ...(this.extractedScores || {}) };
        if (scores.mathScore != null) next.mathScore = scores.mathScore;
        if (scores.rwScore != null) next.rwScore = scores.rwScore;
        this.extractedScores = next;
        if (next.mathScore != null) this.intake.mathScore = next.mathScore;
        if (next.rwScore != null) this.intake.rwScore = next.rwScore;
      },
      removeImage(i) {
        this.scoreImages.splice(i, 1);
        if (this.scoreImages.length === 0) this.clearScores();
      },
      clearScores() {
        this.scoreImages = [];
        this.extractedScores = null;
        this.manualMath = "";
        this.manualRw = "";
        this.intake.mathScore = null;
        this.intake.rwScore = null;
      },
      applyManualScores() {
        const math = parseInt(this.manualMath, 10);
        const rw = parseInt(this.manualRw, 10);
        if (!(math >= 200 && math <= 800) || !(rw >= 200 && rw <= 800)) {
          alert("Enter a Math score and a Reading and Writing score between 200 and 800.");
          return;
        }
        this.mergeScores({ mathScore: math, rwScore: rw });
      },
      async submitWizard() {
        if (!this.canProceed()) return;
        this.generating = true;
        try {
          const payload = { ...this.intake };
          if (payload.startPoint !== 'none') {
            payload.confidenceRatings = {};
            payload.freeTextGoals = "";
          } else {
            payload.mathScore = null;
            payload.rwScore = null;
          }
          await this.planApi().createPlan(payload);
        } catch (e) { console.error(e); alert(e.message || "Failed to create plan. Try again."); }
        finally { this.generating = false; }
      }
    };
  }

  // Calendar view component
  function calendarView(plan) {
    const today = new Date();
    const testDate = new Date(plan.testDate);

    return {
      planData: plan,
      viewMode: 'week',
      get weeks() {
        const out = [];
        const start = new Date(today);
        start.setDate(start.getDate() - start.getDay() + 1); // Monday
        for (let w = 0; w < 10; w++) {
          const weekStart = new Date(start);
          const weekSessions = plan.sessions.filter(s => {
            const d = new Date(s.date);
            return d >= weekStart && d < new Date(weekStart.getTime() + 7 * 24 * 60 * 60 * 1000);
          }).sort((a,b) => new Date(a.date) - new Date(b.date));
          if (weekSessions.length > 0) {
            out.push({
              weekStart,
              label: `Week of ${start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`,
              sessions: weekSessions
            });
          }
          start.setDate(start.getDate() + 7);
        }
        return out;
      },
      get months() {
        const out = [];
        const start = new Date(today.getFullYear(), today.getMonth(), 1);
        const end = new Date(testDate.getFullYear(), testDate.getMonth() + 1, 0);
        let cur = new Date(start);
        while (cur <= end) {
          const monthStart = new Date(cur);
          const monthEnd = new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
          const days = [];
          let d = new Date(monthStart);
          d.setDate(d.getDate() - d.getDay() + 1); // Monday
          for (let i = 0; i < 42; i++) {
            const sessions = plan.sessions.filter(s => s.date === d.toISOString().split('T')[0]);
            days.push({
              date: new Date(d),
              otherMonth: d.getMonth() !== cur.getMonth(),
              sessions
            });
            d.setDate(d.getDate() + 1);
          }
          out.push({
            key: cur.toISOString(),
            label: cur.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }),
            days
          });
          cur.setMonth(cur.getMonth() + 1);
        }
        return out;
      },
      formatTime(t) { return t; },
      async toggleSession(id, completed) {
        try {
          if (!window.KorahStudyPlan) throw new Error("You need to be signed in to update a session.");
          await window.KorahStudyPlan.updateSession(id, { completed });
        } catch (e) { console.error(e); alert(e.message || "Failed to update the session."); }
      },
      async confirmReset() {
        if (!confirm("Delete your study plan and start over?")) return;
        try {
          if (!window.KorahStudyPlan) throw new Error("You need to be signed in to delete your plan.");
          await window.KorahStudyPlan.deletePlan();
        } catch (e) { console.error(e); alert(e.message || "Failed to delete the plan."); }
      }
    };
  }
</script>

  (function() {
    const t = localStorage.getItem('korah_theme') || 'dark';
    if (t === 'light' || (t === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>

<script>
  // Global state for plan using Alpine store (properly reactive)
  document.addEventListener('alpine:init', () => {
    Alpine.store('studyPlan', {
      planState: 'loading',
      planData: null,
      initError: null,
      initStages: [],
      
      setState(state, data) {
        this.planState = state;
        this.planData = data;
        this.initError = null;
        console.log('[Alpine Store] State changed:', state);
      },
      
      setError(error) {
        this.planState = 'empty';
        this.initError = error;
        console.error('[Alpine Store] Error:', error);
      },
      
      addStage(name) {
        this.initStages.push(name);
        console.log('[Alpine Store] Stage:', name);
      }
    });
  });

  // Backward compatibility - expose for non-Alpine code
  let planState = 'loading';
  let planData = null;
  let initError = null;
  const initStages = [];

  const stage = (name) => {
    initStages.push(name);
    console.log('[StudyPlan Init]', name);
    if (initStages.length >= 3) {
      window._initStages = initStages;
    }
  };

  window.planState = planState;
  window.planData = planData;
  window.initError = initError;

  // ===== Listen for study plan ready event =====
  window.addEventListener('korahStudyPlanReady', () => {
    console.log('[StudyPlan] korahStudyPlanReady event fired');
    if (!window.KorahStudyPlan) {
      console.error('[StudyPlan] KorahStudyPlan not found');
      initError = 'Study plan module not found';
      Alpine.store('studyPlan').setError(initError);
      return;
    }

    const unsub = window.KorahStudyPlan.listen(({ state, data }) => {
      console.log('[StudyPlan] listener callback:', state);
      Alpine.store('studyPlan').setState(state, data);
      
      // Keep global vars in sync for backward compat
      planState = state;
      planData = data;
      initError = null;
      window.planState = planState;
      window.planData = planData;
      window.initError = initError;
      document.dispatchEvent(new CustomEvent('planStateChange', { detail: { state, data } }));
    });
    window._studyPlanUnsub = unsub;

    // Fallback if listener doesn't fire within 10 seconds
    setTimeout(() => {
      if (Alpine.store('studyPlan').planState === 'loading') {
        const err = 'Timeout: Firestore listener not responding';
        console.error('[StudyPlan] timeout error:', err);
        Alpine.store('studyPlan').setError(err);
        unsub?.();
      }
    }, 10000);
  });

  // ===== FORCED TIMEOUT: If still loading after 25 seconds, force empty state =====
  setTimeout(() => {
    if (Alpine.store('studyPlan').planState === 'loading') {
      console.error('[StudyPlan] FORCED TIMEOUT after 25s - showing wizard');
      const err = 'Initialization timeout - showing setup wizard';
      Alpine.store('studyPlan').setError(err);
    }
  }, 25000);
</script>
