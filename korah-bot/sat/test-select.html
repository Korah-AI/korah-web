<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<link rel="stylesheet" href="../transitions/page-transitions.css"/>
<script src="../transitions/page-transitions.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Choose a Practice Test — Korah SAT</title>
<link rel="icon" type="image/png" href="../logo-images/newlogo0.png">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<style>
  :root{
    --bg:#06040f; --panel:#0e0a1f; --panel2:#160f2e; --bd:#2a2146;
    --tx:#f1eefc; --tx2:#a89dc0; --primary:#7c3aed; --primary2:#a78bfa;
    --p5:#a78bfa; --ok:#34d399; --warn:#f59e0b; --bad:#ef4444;
  }
  html[data-theme="light"]{
    --bg:#f5f3fb; --panel:#ffffff; --panel2:#ffffff; --bd:#e4e1f0;
    --tx:#171233; --tx2:#5f5a75; --primary:#7c3aed; --primary2:#6d28d9; --p5:#7c3aed;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    font-family:"Plus Jakarta Sans",system-ui,sans-serif; background:var(--bg); color:var(--tx);
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:980px; margin:0 auto; padding:3.5rem 1.5rem 4rem}
  .page-head{display:flex; align-items:center; gap:12px; margin-bottom:6px}
  .back-link{color:var(--tx2); text-decoration:none; font-size:.9rem; font-weight:700; display:inline-flex; align-items:center; gap:6px; margin-bottom:1.5rem}
  .back-link:hover{color:var(--p5)}
  h1{font-family:"Playfair Display",serif; font-size:clamp(1.6rem,4vw,2.2rem); font-weight:900; letter-spacing:-0.02em}
  .lead{color:var(--tx2); margin:0.5rem 0 2.25rem; line-height:1.6}

  .test-grid{display:grid; grid-template-columns:1fr; gap:1.25rem}
  .test-card{
    display:flex; flex-direction:column; justify-content:space-between; gap:1.25rem;
    background:linear-gradient(135deg,rgba(139,92,246,.14),rgba(139,92,246,.03));
    border:1px solid rgba(139,92,246,.32); border-radius:1.125rem; padding:1.625rem 1.75rem;
    transition:border-color .2s, box-shadow .2s, transform .2s;
  }
  .test-card:hover{box-shadow:0 0.375rem 1.375rem rgba(139,92,246,.14); transform:translateY(-2px)}
  .test-card-inner{display:flex; gap:1.125rem; align-items:flex-start}
  .test-icon{
    width:3rem; height:3rem; flex:0 0 3rem; border-radius:.875rem; display:flex; align-items:center; justify-content:center;
    background:rgba(139,92,246,.2); color:var(--p5); font-size:1.5rem;
  }
  .test-title{font-size:1.25rem; font-weight:800; letter-spacing:-0.01em}
  .test-sub{color:var(--tx2); font-size:.875rem; margin-top:.3rem; line-height:1.55}
  .test-meta{display:flex; flex-wrap:wrap; gap:.5rem; margin-top:1rem}
  .meta-chip{
    font-size:.75rem; font-weight:700; color:var(--tx2);
    background:var(--panel); border:1px solid var(--bd); border-radius:62.4375rem; padding:.35rem .8rem;
  }
  .test-actions{display:flex; align-items:center; gap:.875rem; margin-left:4.125rem}
  .cta-btn{
    display:inline-flex; align-items:center; gap:.375rem; text-decoration:none;
    background:linear-gradient(135deg,#7c3aed,#a78bfa); color:#fff; font-weight:700; font-size:.875rem;
    padding:.75rem 1.375rem; border-radius:62.4375rem; border:none; cursor:pointer;
    box-shadow:0 .25rem .875rem rgba(139,92,246,.35); transition:box-shadow .2s, transform .15s;
  }
  .cta-btn:hover{box-shadow:0 .375rem 1.375rem rgba(139,92,246,.5); transform:translateY(-1px)}
  .cta-note{color:var(--tx2); font-size:.78rem; line-height:1.5}
  @media (max-width:560px){ .test-card-inner{flex-direction:column} .test-actions{margin-left:0} }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html"><span class="material-icons-round" style="font-size:1.1rem">arrow_back</span> Back to SAT</a>
  <div class="page-head">
    <h1>Choose a Practice Test</h1>
  </div>
  <p class="lead">Pick a full-length, timed SAT practice test. Each one follows the real exam format — two Reading &amp; Writing modules, a break, then two Math modules — and you won't be able to return to a completed module.</p>

  <div class="test-grid" id="testGrid"></div>
</div>

<script>
  // Apply saved theme early
  (function () {
    var t = localStorage.getItem('korah_theme') || 'dark';
    if (t === 'system') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();

  // Available practice tests. Add new tests here as they are scraped.
  var TESTS = [
    {
      id: 4,
      name: "Practice Test #4",
      desc: "Our first full-length paper practice test, digitized. Official College Board scoring.",
      modules: "2 Reading & Writing + 2 Math modules",
      questions: "120 questions",
      break: "10-minute break between sections",
      scoring: "Official conversion table",
    },
  ];

  var grid = document.getElementById('testGrid');
  grid.innerHTML = TESTS.map(function (t) {
    var href = './questions.html?mode=full&test=' + t.id;
    var chips = [t.questions, t.modules, t.break, t.scoring]
      .filter(Boolean)
      .map(function (c) { return '<span class="meta-chip">' + c + '</span>'; })
      .join('');
    return (
      '<div class="test-card">' +
        '<div class="test-card-inner">' +
          '<div class="test-icon"><span class="material-icons-round">assignment</span></div>' +
          '<div>' +
            '<div class="test-title">' + t.name + '</div>' +
            '<div class="test-sub">' + t.desc + '</div>' +
            '<div class="test-meta">' + chips + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="test-actions">' +
          '<a class="cta-btn" href="' + href + '">Start Test <span class="material-icons-round" style="font-size:1rem">arrow_forward</span></a>' +
          '<span class="cta-note">Your progress is saved automatically if you exit partway.</span>' +
        '</div>' +
      '</div>'
    );
  }).join('');
</script>
</body>
</html>
