<!DOCTYPE html>
<html lang="en" x-data="{
  theme: localStorage.getItem('korah_theme') || 'dark',
  sidebarCollapsed: window.innerWidth <= 768 ? false : localStorage.getItem('korah_sidebar_collapsed') === 'true',
  mobileOpen: false,
  getEffectiveTheme() {
    if (this.theme === 'system') {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    return this.theme;
  },
  toggleSidebar() {
    if (window.innerWidth <= 768) {
      this.mobileOpen = !this.mobileOpen;
      const overlay = document.querySelector('.sidebar-overlay');
      if (overlay) overlay.classList.toggle('show', this.mobileOpen);
    } else {
      this.sidebarCollapsed = !this.sidebarCollapsed;
      localStorage.setItem('korah_sidebar_collapsed', this.sidebarCollapsed);
    }
  }
}" :data-theme="getEffectiveTheme()" x-cloak>
<head>
<link rel="stylesheet" href="../transitions/page-transitions.css"/>
<script src="../transitions/page-transitions.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Korah AI — Latest SAT Questions</title>
<link rel="icon" type="image/png" href="../logo-images/newlogo0.png">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="../sidebar-loader.js" defer></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../study/js/sidebar.js"></script>
<link rel="stylesheet" href="../app/korah-chat.css"/>
<link rel="stylesheet" href="./sat.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css"/>
</head>

<body class="sat-grey">
<style>
  html:not(.korah-page-ready) { background: #06040f !important; }
  html[data-theme="light"]:not(.korah-page-ready) { background: #d2d2d2 !important; }
  html:not(.korah-page-ready) body { opacity: 0 !important; }
</style>

<script>
  (function() {
    const t = localStorage.getItem('korah_theme') || 'dark';
    if (t === 'light' || (t === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
  import { setupKorahDB } from "../app/data/firestore-store.js";
  import { initSatAnalytics } from "./js/sat-analytics.js";
  import { startAuthGuard } from '../auth-guard.js';

  const firebaseConfig = {
    apiKey: "AIzaSyDvabVNkVMfjKl1m3dQSlW06h-iomgcNJM",
    authDomain: "korah-app.firebaseapp.com",
    projectId: "korah-app",
    storageBucket: "korah-app.firebasestorage.app",
    messagingSenderId: "226169460321",
    appId: "1:226169460321:web:b166fc8260107c55dafc20"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.KorahTransitions.go('../landing/index.html');
      return;
    }
    await setupKorahDB(app, user.uid);
    await initSatAnalytics(app, user.uid);
    const detail = { uid: user.uid };
    window._korahReadyFired = detail;
    window.dispatchEvent(new CustomEvent('korahReady', { detail }));
    startAuthGuard(auth, '../landing/index.html');
  });

  // #logout-btn lives in the sidebar, which sidebar-loader.js injects asynchronously,
  // so it does not exist yet when this module runs. Delegate from document instead.
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#logout-btn')) return;
    window.confirmLogout(async () => {
      await signOut(auth);
      localStorage.removeItem('korah_first_name');
      window.KorahTransitions.go('../login.html');
    });
  });
</script>

<canvas id="bg-canvas" class="fixed inset-0 z-0 pointer-events-none"></canvas>
<div id="sidebar-root"></div>

<!-- ═══ MAIN AREA WRAPPER ═══ -->
<div id="main-area-wrapper" class="main-area-wrapper">

<!-- ═══ MAIN CHAT AREA ═══ -->
<main id="main-content" class="main-content">

  <!-- Top bar -->
  <header class="chat-topbar bg-sf glass-sm t-theme bd" style="opacity: 0.95;">
    <button id="sidebar-toggle" @click="toggleSidebar()" class="sidebar-toggle-btn t-btn tx2" aria-label="Toggle sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <div class="chat-title-area">
      <div class="korah-status-dot"></div>
      <span class="font-semibold tx text-sm" id="chat-title">Latest Questions</span>
    </div>
  </header>

  <!-- SAT Content -->
  <div class="sat-page sat-bank-page" style="padding: 1.25rem;">
    <section class="sat-bank-shell">
      <section class="sat-bank-header">
        <div class="sat-bank-header-text">
          <div class="sat-eyebrow-row">
            <img src="../logo-images/newlogo12.png" class="sat-eyebrow-logo" alt="Korah logo"/>
            <p class="sat-eyebrow">Korah SAT Prep</p>
          </div>
          <h1 class="sat-bank-title">Latest Questions</h1>
          <p class="sat-bank-desc">
            College Board recently released 270+ new SAT questions. Pick a section and the skills you want to practice, then dive in. <br>
            These are fresh questions from the official <strong> College Board Question Bank</strong>.
          </p>
        </div>
        <img src="../logo-images/newlogo3.png" class="sat-bank-header-deco" alt=""/>
      </section>

      <section class="sat-bank-controls">
        <div class="sat-session-bar">
          <div class="sat-limit-dd" id="limitDropdown">
            <button id="limitToggle" class="sat-filters-toggle t-btn" type="button" aria-expanded="false" aria-label="Set question limit">
              <svg class="sat-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
              <span id="limitToggleLabel">Question Limit</span>
              <svg class="sat-ico sat-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div id="limitMenu" class="sat-limit-menu">
              <div class="sat-filter-note">Number of questions</div>
              <input id="limitInput" type="text" class="sat-limit-input" placeholder="e.g. 20 (blank = no limit)" />
            </div>
          </div>
          <button id="filtersToggle" class="sat-filters-toggle t-btn" type="button" aria-expanded="false" aria-controls="filterRow" aria-label="Toggle filters">
            <svg class="sat-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
            <span>Filters</span>
            <span id="filtersBadge" class="sat-filters-badge" hidden>0</span>
            <svg class="sat-ico sat-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
        <!-- Filter buttons are rendered by sat-new-questions.js from FILTERS -->
        <div class="sat-filter-row" id="filterRow" hidden></div>
      </section>

      <section class="sat-bank-layout">
        <div class="sat-section-column" id="sectionColumns"></div>
      </section>
    </section>
  </div>

</main>

</div><!-- end .main-area-wrapper -->

<!-- Bottom selection pill -->
<div id="selectionPill" class="sat-selection-pill" hidden>
  <span class="sat-pill-count" id="pillCountLabel">0 topics selected</span>
  <button id="pillRandomize" class="sat-pill-btn sat-pill-randomize t-btn" type="button" aria-pressed="false">
    <svg class="sat-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
    <span>Randomize</span>
  </button>
  <button id="pillStart" class="sat-pill-btn sat-pill-start t-btn" type="button">
    <span>Start</span>
    <svg class="sat-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
<script src="../app/timer-manager.js"></script>
<script src="../study/js/sidebar.js"></script>
<script src="../study/js/study-api.js"></script>
<script src="../app/korah-chat.js"></script>

<script>
  window.addEventListener('korahReady', () => {
    if (window.KorahSidebar) {
      window.KorahSidebar.initSidebar({
        chatBaseUrl: "../chat.html",
        itemPageUrl: "../study/item.html",
        onItemClick: (id) => {
          if (window.KorahChat && typeof window.KorahChat.switchToSession === 'function') {
            window.KorahChat.switchToSession(id);
          }
        }
      });
    }
  }, { once: true });
</script>

<script src="./js/sat-shared.js"></script>
<script src="./js/sat-new-questions.js"></script>

</body>
</html>
